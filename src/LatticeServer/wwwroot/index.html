<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice Server — Entity Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Lattice Server</h1>
    <div id="status-bar">
      <div class="stat">
        <span>With location:</span>
        <span class="stat-value" id="located-count">0</span>
      </div>
      <div class="stat">
        <div id="conn-dot" class="connecting"></div>
        <span id="conn-label">Connecting…</span>
      </div>
      <div class="stat">
        <button id="server-tools-btn" onclick="toggleServerToolsMenu(event)">
          Server Tools
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="margin-left:4px">
            <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="server-tools-menu">
          <div class="server-tools-label">Server Tools</div>
          <button class="server-tools-item server-tools-danger" onclick="serverToolDeleteAllEntities()">Delete All Entities</button>
          <button class="server-tools-item server-tools-danger" onclick="serverToolDeleteAllTasks()">Delete All Tasks</button>
        </div>
      </div>
    </div>
  </header>

  <div id="content">
    <div id="panel">
      <div id="panel-header">
        <button id="back-btn" onclick="handleBackBtn()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M7.5 1.5L3 6l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </button>
        <span id="panel-title">Entities</span>
        <span id="panel-count">0</span>
      </div>

      <div id="entity-list">
        <div id="panel-empty">No entities yet</div>
      </div>

      <div id="detail-view">
        <div class="detail-hero">
          <div class="detail-name" id="detail-hero-name"></div>
          <div class="detail-id"   id="detail-hero-id"></div>
        </div>
        <div class="detail-tabs">
          <button class="detail-tab active" data-tab="entity" onclick="switchDetailTab('entity')">Entity</button>
          <button class="detail-tab"        data-tab="tasks"  onclick="switchDetailTab('tasks')">Tasks</button>
          <button class="detail-tab"        data-tab="dev"    onclick="switchDetailTab('dev')">Dev</button>
        </div>
        <div id="detail-tab-content"></div>
      </div>

      <div id="task-wizard"></div>
    </div>

    <div id="map-wrapper">
      <div id="map"></div>
      <div id="map-pick-banner">Click an entity marker to select it, or click the map to place a point · Esc to cancel</div>
    </div>
  </div>

  <!-- Entity JSON modal -->
  <div id="entity-json-modal" onclick="handleJsonModalBackdropClick(event)">
    <div class="json-modal-box">
      <div class="json-modal-header">
        <span class="json-modal-title">Entity JSON</span>
        <button class="json-modal-copy" onclick="copyEntityJson()">Copy</button>
        <button class="json-modal-close" onclick="closeEntityJsonModal()">✕</button>
      </div>
      <div class="json-modal-body">
        <pre id="entity-json-pre"></pre>
      </div>
    </div>
  </div>

  <!-- Status picker popup -->
  <div id="status-picker">
    <div class="status-picker-label">Set Status</div>
    <div id="status-picker-options"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
